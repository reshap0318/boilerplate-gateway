# ═══════════════════════════════════════════════════════════════
#  api-gateway monorepo — Production Compose
#  Usage: docker compose up -d --build
#
#  fe only ever talks to gateway (via nginx /api proxy). gateway is
#  the only service exposed publicly beyond its own port; uam/message
#  are reachable only inside the docker network, by container name.
#  mysql/redis run in separate, already-existing containers reached
#  via the external mysql-network / redis-network.
# ═══════════════════════════════════════════════════════════════

services:
  gateway:
    build:
      context: .
      dockerfile: etc/Dockerfile.gateway
    image: api-serv-gateway:latest
    container_name: api-serv-gateway
    restart: unless-stopped
    env_file:
      - .env.gateway
    volumes:
      - ./serv-gateway/storage:/app/storage
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - gateway-net
      - mysql-network
      - redis-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  uam:
    build:
      context: .
      dockerfile: etc/Dockerfile.svc
      args:
        SERVICE: serv-uam
    image: api-serv-uam:latest
    container_name: api-serv-uam
    restart: unless-stopped
    env_file:
      - .env.uam
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - gateway-net
      - mysql-network
      - redis-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  message:
    build:
      context: .
      dockerfile: etc/Dockerfile.svc
      args:
        SERVICE: serv-message
    image: api-serv-message:latest
    container_name: api-serv-message
    restart: unless-stopped
    env_file:
      - .env.message
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - gateway-net
      - mysql-network
      - redis-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fe:
    build:
      context: .
      dockerfile: etc/Dockerfile.fe
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
        VITE_APP_NAME: ${VITE_APP_NAME:-Api Gateway}
    image: api-serv-fe:latest
    container_name: api-serv-fe
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${FE_PORT:-3000}:3000"
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gateway-net:
    driver: bridge
    name: gateway-net
  mysql-network:
    external: true
  redis-network:
    external: true
