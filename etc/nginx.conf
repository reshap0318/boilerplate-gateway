# Only set the Connection header to "upgrade" when the client actually sent an
# Upgrade request (WebSocket); otherwise close it, so this one location can serve
# both plain REST and WebSocket without a separate location per protocol.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       3000;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Gateway API proxy ──────────────────────────────────────────
    # fe only ever talks to the gateway; the gateway proxies to serv-uam / serv-message
    # internally, fe never reaches them directly. Every http Service's base_path lives
    # under /api/svc/* (see gateway_seeder.go, helpers.ValidateBasePath) alongside the
    # gateway's own Management API (/api/*) — one fixed location, no per-service update.
    location /api/ {
        proxy_pass         http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket Services live under /ws/svc/* — separate location so it can be tuned for
    # long-lived connections (read timeout, no buffering) without affecting REST traffic.
    location /ws/ {
        proxy_pass         http://gateway:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    location = /health {
        proxy_pass         http://gateway:8080/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Static storage (avatars, uploads, etc served by the gateway)
    location /storage/ {
        proxy_pass         http://gateway:8080/storage/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Vue SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
